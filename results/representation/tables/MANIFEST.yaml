reproduces_stored_summaries:
  rules:
    summary_csv: acc = k/n over the innermost trials of (test, condition, budget[, d]), nulls dropped;
      exact float equality of acc and n with every covered trial set; lo and hi equal the Wilson interval
      at z = 1.96 within 1e-12; budgets 256 and 512 are checked against the raw records
    figure_data_csv: 'B, C, E: the stored value is k/n with the recomputed k and n; D: the stored difference
      is (k1 - k0)/n with the recomputed counts; A: equal to the probe table within 1e-15; standard errors
      sqrt(p(1-p)/n) within 1e-12'
  countries|summary_csv:
    status: stored summaries not present
    mismatches: []
  countries|figure_data_csv:
