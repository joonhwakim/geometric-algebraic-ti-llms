  - erase
  - rand_erase
  - write_1.0
  - write_rand
  cot_icl:
  - intact
  - erase
  - rand_erase
condition_glossary:
  intact: no edit (a' = a)
  erase: the coordinate on the rank direction set to zero (a' = 0)
  invert: the coordinate negated (a' = -a)
  rand_erase: the coordinate on a random unit direction set to zero (control for erase)
  write_<eta>: a' = (1 - eta) a + eta (alpha + beta z_new), z_new a random ordering of the trial's items
    with |Spearman rho| <= 0.2 to the real one
  write_rand: the write at eta = 1 along the random direction (control for the writes)
budgets_kept:
- 0
- 1024
budgets_dropped:
- 256
- 512
innermost_ranks: rank_low >= 2 and rank_high <= 8 (innermost 7 of 11; distances 1-6)
row_order: dim (as declared), test (as declared), condition (as declared), budget, pool, premise_order,
  d, trial_id
trial_key: (dim, test, condition, budget, pool, d, trial_id) is unique
text_columns_dropped:
- prompt
- trace_text
- items
- A
- B
- cell_id
- lp_yes
- lp_no
- predicted
- correct
- world_truth
- written_truth
- stored_predicted
- layers
- n_edits
- trace_n_tokens
- cut
- stage2_source
record_guards:
- test and condition equal the file name's; assignment and item set fit the test
- d == rank_high - rank_low; direct tests at budget 0, reasoning tests at 256/512/1024
- eta as the condition names it
- is_correct, agree_written and agree_world equal the agreement of predicted with correct, written_truth
  and world_truth (agree_world null exactly for the given names)
- no (pool, d, trial_id, budget) repeated in a file
- every condition of a test scores the same trials; every reasoning trial has its three readouts
