conditions:
  icl_cities: invented city names under the population instruction, all adjacent relations shown (icl_cities
    / budget_icl_cities; run with country population)
  icl_people: novel given names ordered by height, all adjacent relations shown (icl / budget_icl; run
    with country population)
  no_context: familiar items of the dimension, query alone (iwl / budget_iwl; the main item set and its
    replicate item sets built to the same spacing from disjoint items)
innermost_ranks: rank_low >= 2 and rank_high <= 8 (innermost 7 of 11; distances 1-6)
trial_key_format: <dim>:<surface_form_mode>|<assignment_strategy>|<symbolic_distance>|<trial_id>
row_order: 'within (model, test, dim, budget): the stored files in name order, then the rows in file order'
text_columns_dropped:
- prompt
- cot_trace
- cot_stage1_prompt
- extra (rank_to_item, actual_items, exemplar_items)
- prompt_spec
- cell_id
- timestamp_iso
- duration_seconds
row_guards:
- N == 11 and master_seed == 42 on every row
- the file's hop, symbolic_distance, extra.hop and prompt_spec.hop agree
- item_pool and surface_form_mode are the test's; the assignment is one the test declares
- prompt_spec.instructions_v1_id ends in '_ctxonly' exactly when the test's instruction is the context-only
  one, and the context-only sentence is in the prompt exactly then
- every prompt contains 'true or false that' and 'Answer whether the statement is true or false.'
- an IWL test row (surface zero_context) shows no '<item> > <item>' or '<item> < <item>' relation before
  the question, in its prompt or, for a reasoning row, its reasoning-pass prompt
- rank_high - rank_low == symbolic_distance (a ladder row's ranks read from the question before the trace)
- a reasoning row's prompt_spec.max_new_tokens is its file's budget; its trigger is the model's (none
  on native thinking models, passive otherwise)
- no reasoning trace carries byte-level BPE markers (U+0120, U+010A)
- every ladder row's queried ranks equal its direct twin's; every budget-0 row equals the twin in gold,
  answer, correctness and logit gap (1e-6) and takes its premise order index
- every trial of a ladder carries every budget; every direct trial of a condition with a ladder is in
  it
- (model, test, dim, budget, trial_key) is unique
- rows per (model, test, dim) = assignments x premise orders x 72 queryable pairs (x 11 budgets for a
  ladder); innermost trials per (dim, condition, distance) = 2 x premise orders x (7 - distance)
ladder_budgets:
- 0
- 32
- 64
- 128
- 256
- 384
- 512
- 640
- 768
- 896
- 1024
