  qwen3-4b: native
  qwen3-8b: native
dimensions:
  countries: country population
  cities: city population (constant-ratio spacing; the interventions' city item set)
  citieslinear: city population (the paper's City population item set, evenly spaced)
  animals: animal body mass
  usstates: US state population
  countryarea: country surface area
dims:
  countries:
    dimension: countries
    item_set: countries_by_population_11
  cities:
    dimension: cities
    item_set: cities_by_population_11
  citieslinear:
    dimension: citieslinear
    item_set: cities_by_population_11_linear
  animals:
    dimension: animals
    item_set: animals_by_mass_11
  usstates:
    dimension: usstates
    item_set: us_states_by_population_11
  countryarea:
    dimension: countryarea
    item_set: countries_by_area_11
tests:
  content:
    runner: direct
    published_as: content_ctxonly
    conditions:
      natural: congruent
      reversed: reversed
      random: shuffled
    surface: fixed_gt
    context_only_instruction: true
    premise_orders: 10
    rows_per_model_and_set: 2160
    item_sets:
      countries: countries_by_population_11
      cities: cities_by_population_11
      citieslinear: cities_by_population_11_linear
      animals: animals_by_mass_11
      usstates: us_states_by_population_11
      countryarea: countries_by_area_11
  uninformative:
    runner: direct
    published_as: uninformative_ctxonly
    conditions:
      natural: unrelated_context
    surface: disjoint_context
    context_only_instruction: true
    premise_orders: 10
    rows_per_model_and_set: 720
    item_sets:
      countries: countries_by_population_11_disjoint
      cities: cities_by_population_11_disjoint
      citieslinear: cities_by_population_11_linear_disjoint
      animals: animals_by_mass_11_disjoint
      usstates: us_states_by_population_11_disjoint
      countryarea: countries_by_area_11_disjoint
  budget_natural:
    runner: ladder
    published_as: budget_natural_ctxonly
    conditions:
      natural: congruent
    surface: fixed_gt
    context_only_instruction: true
    premise_orders: 10
    rows_per_model_and_set: 7920
    item_sets:
      countries: countries_by_population_11
      cities: cities_by_population_11
      citieslinear: cities_by_population_11_linear
      animals: animals_by_mass_11
      usstates: us_states_by_population_11
      countryarea: countries_by_area_11
  budget_reversed:
    runner: ladder
    published_as: budget_reversed_ctxonly
    conditions:
      reversed: reversed
    surface: fixed_gt
    context_only_instruction: true
    premise_orders: 10
    rows_per_model_and_set: 7920
    item_sets:
      countries: countries_by_population_11
      cities: cities_by_population_11
      citieslinear: cities_by_population_11_linear
      animals: animals_by_mass_11
      usstates: us_states_by_population_11
      countryarea: countries_by_area_11
  budget_shuffled:
    runner: ladder
    published_as: budget_shuffled_ctxonly
    conditions:
      random: shuffled
    surface: fixed_gt
    context_only_instruction: true
    premise_orders: 10
    rows_per_model_and_set: 7920
    item_sets:
      countries: countries_by_population_11
      cities: cities_by_population_11
      citieslinear: cities_by_population_11_linear
      animals: animals_by_mass_11
      usstates: us_states_by_population_11
      countryarea: countries_by_area_11
conditions:
  congruent: familiar items, relations in the true order (content natural / budget_natural)
  reversed: familiar items, relations exactly reversed (content reversed / budget_reversed)
  shuffled: familiar items, random assignment of items to ranks (content random / budget_shuffled)
  unrelated_context: familiar items queried after ten true relations among eleven other items of the same
    dimension (uninformative; no ladder)
innermost_ranks: rank_low >= 2 and rank_high <= 8 (innermost 7 of 11; distances 1-6)
trial_key_format: <dim>:<surface_form_mode>|<assignment_strategy>|<symbolic_distance>|<trial_id>
row_order: 'within (model, test, dim, budget): the stored files in name order, then the rows in file order'
text_columns_dropped:
- prompt
- cot_trace
- cot_stage1_prompt
- extra (rank_to_item, actual_items, exemplar_items)
- prompt_spec
- cell_id
- timestamp_iso
- duration_seconds
row_guards:
- N == 11 and master_seed == 42 on every row
- the file's hop, symbolic_distance, extra.hop and prompt_spec.hop agree
- item_pool and surface_form_mode are the test's; the assignment is one the test declares
- prompt_spec.instructions_v1_id ends in '_ctxonly' exactly when the test's instruction is the context-only
  one, and the context-only sentence is in the prompt exactly then
- every prompt contains 'true or false that' and 'Answer whether the statement is true or false.'
- an IWL test row (surface zero_context) shows no '<item> > <item>' or '<item> < <item>' relation before
  the question, in its prompt or, for a reasoning row, its reasoning-pass prompt
- rank_high - rank_low == symbolic_distance (a ladder row's ranks read from the question before the trace)
- a reasoning row's prompt_spec.max_new_tokens is its file's budget; its trigger is the model's (none
  on native thinking models, passive otherwise)
- no reasoning trace carries byte-level BPE markers (U+0120, U+010A)
- every ladder row's queried ranks equal its direct twin's; every budget-0 row equals the twin in gold,
  answer, correctness and logit gap (1e-6) and takes its premise order index
- every trial of a ladder carries every budget; every direct trial of a condition with a ladder is in
  it
- (model, test, dim, budget, trial_key) is unique
- rows per (model, test, dim) = assignments x premise orders x 72 queryable pairs (x 11 budgets for a
  ladder); innermost trials per (dim, condition, distance) = 2 x premise orders x (7 - distance)
ladder_budgets:
- 0
- 32
- 64
- 128
- 256
- 384
- 512
- 640
- 768
- 896
- 1024
instruction: 'every context condition uses the context-only instruction: the system instruction ends with
  the sentence ''Base your answer only on the comparisons given — not on outside knowledge.''; the test
  and condition names carry no suffix because the original-instruction runs are not exported'
checks:
  per_test_directories_note: 'one entry per <model>/<dim>/<test> directory read (a ladder''s direct twin
    is read for its checks even when not exported): rows kept and files read; for a ladder also the trials
    and the trials whose identical direct copies disagree across the budgets (n_direct_disagreements,
    a bf16 tie flip; the export fails above 1% of a directory''s trials)'
